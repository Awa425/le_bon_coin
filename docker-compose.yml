services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_local
    ports:
      - "5432:5432"
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage objet compatible S3 (photos). En production : Scaleway / OVHcloud Object Storage.
  # Buckets : « marketplace-uploads » (originaux, privé) et « marketplace-photos » (déclinaisons, lecture publique),
  # créés par `php artisan photos:setup-storage`.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=512
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=http://localhost:4200,http://localhost:4201
    ports:
      - "8333:8333"
    volumes:
      - marketplace_s3_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Moteur de recherche (RECH-01 à 07). Nœud unique, sécurité désactivée : usage local uniquement.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # Mémoire limitée pour un poste de développement (à augmenter en recette / production).
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports:
      - "9200:9200"
    volumes:
      - marketplace_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  marketplace_postgres_data:
  marketplace_s3_data:
  marketplace_opensearch_data:
