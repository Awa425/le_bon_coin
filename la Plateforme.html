<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>la Plateforme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : en-tête collant + contenu centré (max 1180px) ; sur mobile, barre d'onglets fixe en bas. Charte orange et blanc ; jaune réservé à « À la une ». */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F8F3EF; --line:#EEE5DF;
  --fg:#1F1915; --muted:#6F6259;
  --accent:#E0520F; --accent-hover:#C2440A; --accent-ink:#FFFFFF; --accent-soft:#FFEDE1;
  --sun:#F5B301; --sun-soft:#FFF4D6; --sun-ink:#5A4300;
  --good:#23855A;
  --danger:#B93E2A; --danger-soft:#FBE4DF; --info:#2A67A6; --info-soft:#E1ECF8;
  --t1:#FFF0E5; --t2:#F7F1EC; --t3:#FDE9DE; --t4:#F4EEE8; --tile-ink:#7C4A2A;
  --map-land:#F7F2ED; --map-road:#FFFFFF; --map-water:#DCEAF2; --map-park:#E6EFDF;
  --shadow:0 1px 2px rgba(31,25,21,.06),0 8px 24px rgba(31,25,21,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --hdr:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141110; --surface:#1C1816; --surface-2:#26201D; --line:#3A302A;
  --fg:#F6F0EB; --muted:#AB9D93;
  --accent:#FF8A3D; --accent-hover:#FFA368; --accent-ink:#2A1206; --accent-soft:#3D2414;
  --sun:#F5C542; --sun-soft:#3A2F12; --sun-ink:#F9DD93;
  --good:#5CC98A;
  --danger:#F07C66; --danger-soft:#3D1E18; --info:#7FAEE3; --info-soft:#182A3D;
  --t1:#33231A; --t2:#2B2420; --t3:#382319; --t4:#2A2522; --tile-ink:#F0BE9C;
  --map-land:#1F1A17; --map-road:#2F2724; --map-water:#173040; --map-park:#1E2A1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --hdr:#1C1816; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141110; --surface:#1C1816; --surface-2:#26201D; --line:#3A302A;
  --fg:#F6F0EB; --muted:#AB9D93;
  --accent:#FF8A3D; --accent-hover:#FFA368; --accent-ink:#2A1206; --accent-soft:#3D2414;
  --sun:#F5C542; --sun-soft:#3A2F12; --sun-ink:#F9DD93;
  --good:#5CC98A;
  --danger:#F07C66; --danger-soft:#3D1E18; --info:#7FAEE3; --info-soft:#182A3D;
  --t1:#33231A; --t2:#2B2420; --t3:#382319; --t4:#2A2522; --tile-ink:#F0BE9C;
  --map-land:#1F1A17; --map-road:#2F2724; --map-water:#173040; --map-park:#1E2A1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --hdr:#1C1816; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.logo .mk{width:30px;height:30px;flex:none}
.logo em{font-style:normal;color:var(--accent)}
.hsearch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:8px 14px;max-width:520px}
.hsearch:focus-within{border-color:var(--accent);background:var(--surface)}
.hsearch input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.hnav{display:flex;align-items:center;gap:4px;margin-left:auto}
.hnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);padding:6px 10px;border-radius:10px;position:relative}
.hnav a:hover,.hnav a.on{color:var(--fg);background:var(--surface-2)}
.badge{position:absolute;top:2px;right:8px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:600;padding:11px 20px;border:1px solid transparent;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-p:hover{background:var(--accent-hover)}
.btn-s{background:var(--surface);border-color:var(--line)}
.btn-s:hover{border-color:var(--fg)}
.btn-g{background:transparent;color:var(--accent);padding-inline:10px}
.btn-sm{padding:7px 14px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Mobile tabbar */
.tabbar{display:none}
@media (max-width:760px){
  .hnav,.hdr .btn-dep{display:none}
  .hsearch{display:none}
  .hdr.has-search .hsearch{display:flex}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--hdr);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0;position:relative}
  .tabbar a.on{color:var(--accent)}
  .tabbar .dep{color:var(--accent-ink)}
  .tabbar .dep span.plus{width:40px;height:40px;border-radius:14px;background:var(--accent);display:grid;place-items:center;margin-top:-14px;box-shadow:var(--shadow)}
  .tabbar .badge{right:calc(50% - 22px)}
  main{padding-bottom:84px}
}
main{min-height:70vh}
.screen{padding-block:28px 48px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}
.pill.warn{background:var(--sun-soft);color:var(--sun-ink)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;outline:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:110px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:90;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:760px){.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}

/* Listing card */
.grid-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.lc{display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.lc .ph{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:var(--r-m);overflow:hidden;display:grid;place-items:center;color:var(--tile-ink)}
.lc .ph svg.ill{width:44%;height:44%;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.lc:hover .ph svg.ill{transform:scale(1.06)}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);display:grid;place-items:center;box-shadow:var(--shadow)}
.fav.on{color:var(--danger)}
.fav.on .ico{fill:currentColor}
.ph .tags{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
.ph .tags .pill{background:var(--surface);color:var(--fg)}
.ph .tags .pill.sun{background:var(--sun);color:#2B2000}
.lc h3{font-family:var(--f-body);font-size:15px;font-weight:600;line-height:1.3;letter-spacing:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc .pr{font-family:var(--f-display);font-weight:700;font-size:18px}
.lc .meta{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}

/* Home */
.hero{background:linear-gradient(180deg,var(--accent-soft),var(--bg));border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:44px 36px;display:grid;gap:22px}
.hero h1{font-size:clamp(30px,5vw,50px);font-weight:800;max-width:16ch}
.hero h1 span{color:var(--accent)}
.hero p.lead{color:var(--muted);font-size:17px;max-width:52ch}
.bigsearch{display:grid;grid-template-columns:1.4fr 1fr auto auto;gap:0;background:var(--surface);border:1.5px solid var(--fg);border-radius:18px;padding:6px;max-width:920px;box-shadow:var(--shadow)}
.bigsearch .seg{display:flex;align-items:center;gap:10px;padding:8px 14px;min-width:0}
.bigsearch .seg+.seg{border-left:1px solid var(--line)}
.bigsearch .seg div{display:flex;flex-direction:column;min-width:0;flex:1}
.bigsearch .seg small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bigsearch input,.bigsearch select{border:0;background:transparent;outline:0;padding:0;font-size:15px;min-width:0;width:100%}
.bigsearch .btn{border-radius:13px;padding-inline:24px}
@media (max-width:760px){
  .bigsearch{grid-template-columns:1fr 1fr;border-radius:16px}
  .bigsearch .seg:first-child{grid-column:1/-1}
  .bigsearch .seg+.seg{border-left:0;border-top:1px solid var(--line)}
  .bigsearch .seg:nth-child(3){border-left:1px solid var(--line)}
  .bigsearch .btn{grid-column:1/-1;margin-top:6px;padding-block:13px}
}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip:hover{border-color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cats{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;font-weight:600;padding:14px 6px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);cursor:pointer}
.cat:hover{border-color:var(--accent);color:var(--accent)}
.cat .ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--tile-ink)}
.cat .ci svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){.cats{grid-template-columns:repeat(4,1fr)}}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.trust .card{padding:20px;display:flex;gap:14px;align-items:flex-start}
.trust .ti{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.trust h3{font-size:16px;margin-bottom:4px}
@media (max-width:760px){.trust{grid-template-columns:1fr}}
.stack{display:grid;gap:40px}
.pro-band{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px;border-radius:var(--r-l);background:var(--fg);color:var(--bg)}
.pro-band h3{font-size:22px}
.pro-band p{opacity:.75;margin-top:4px}
.pro-band .btn{background:var(--bg);color:var(--fg)}

/* Results */
.res{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
.filters{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:grid;gap:22px;padding:20px}
.filters h4{font-family:var(--f-body);font-size:14px;font-weight:700;margin-bottom:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0;cursor:pointer}
.chk input{accent-color:var(--accent);width:17px;height:17px}
.range{width:100%;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.res-top h1{font-size:24px}
.seg-t{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg-t button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg-t button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.mfilters{display:none}
@media (max-width:900px){
  .res{grid-template-columns:1fr}
  .filters{display:none}
  .mfilters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
  .mfilters .chip{flex:none}
}
.mapbox{position:relative;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;max-width:100%;background:var(--map-land)}
.mapbox svg{width:100%;height:100%;display:block}
.mpin{cursor:pointer}
.mpin rect{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}
.mpin text{fill:var(--fg);font:700 12px var(--f-body)}
.mpin.on rect{fill:var(--fg)}
.mpin.on text{fill:var(--bg)}
.map-card{position:absolute;left:12px;bottom:12px;right:12px;max-width:340px;display:flex;gap:12px;padding:10px;align-items:center;box-shadow:var(--shadow);cursor:pointer}
.map-card .ph{width:72px;height:56px;border-radius:10px;display:grid;place-items:center;color:var(--tile-ink);flex:none}
@media (max-width:760px){.mapbox{aspect-ratio:4/5}.map-card{max-width:none}}
.map-card .ph svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.5}

/* Listing detail */
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.crumbs a:hover{color:var(--accent)}
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:start}
.gallery .main{aspect-ratio:4/3;max-width:100%;border-radius:var(--r-l);display:grid;place-items:center;color:var(--tile-ink);position:relative}
.gallery .main svg.ill{width:38%;height:38%;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.gallery .count{position:absolute;right:12px;bottom:12px;background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.thumbs button{aspect-ratio:1;border-radius:10px;border:2px solid transparent;display:grid;place-items:center;color:var(--tile-ink);padding:0}
.thumbs button.on{border-color:var(--fg)}
.thumbs svg{width:40%;height:40%;stroke:currentColor;fill:none;stroke-width:1.5}
.dinfo{display:grid;gap:22px;margin-top:26px}
.dinfo h2{font-size:18px}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.attrs div{background:var(--surface);padding:12px 14px}
.attrs dt{font-size:12px;color:var(--muted)}
.attrs dd{margin:0;font-weight:600}
.buybox{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));padding:22px;display:grid;gap:16px}
.buybox h1{font-size:24px;font-weight:700}
.buybox .price{font-family:var(--f-display);font-size:34px;font-weight:800}
.prot{display:flex;gap:12px;padding:14px;border-radius:var(--r-m);background:var(--accent-soft);color:var(--fg);font-size:14px}
.prot .ico{color:var(--accent)}
.seller{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);background:var(--t3);color:var(--fg);flex:none}
.stars{display:inline-flex;gap:1px;color:var(--sun)}
.stars .ico{width:14px;height:14px;fill:currentColor;stroke:none}
.minimap{height:150px;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.minimap svg{width:100%;height:100%;display:block}
.mob-cta{display:none}
@media (max-width:900px){
  .detail{grid-template-columns:1fr}
  .buybox{position:static}
}
@media (max-width:760px){
  .mob-cta{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--hdr);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .mob-cta .btn{flex:1}
  .screen.has-cta{padding-bottom:90px}
}

/* Sheet / modal */
.ov{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:80;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:var(--r-l);padding:24px;width:100%;max-width:420px;display:grid;gap:16px;box-shadow:var(--shadow)}
.sheet h3{font-size:20px}
.offer-sugg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.offer-sugg button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 4px;font-weight:600}
.offer-sugg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.money-inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);padding:0 14px;background:var(--surface)}
.money-inp input{border:0;outline:0;background:transparent;font-family:var(--f-display);font-size:28px;font-weight:700;padding:10px 0;width:100%}
.money-inp:focus-within{border-color:var(--accent)}

/* Deposit */
.dep{max-width:760px;margin:0 auto}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 26px}
.steps div{display:grid;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.steps div::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.steps div.done::before,.steps div.on::before{background:var(--accent)}
.steps div.on{color:var(--fg)}
.dep .card{padding:26px;display:grid;gap:20px}
.drop{border:2px dashed var(--line);border-radius:var(--r-m);padding:28px;display:grid;place-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.photos .p{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;color:var(--tile-ink);position:relative}
.photos .p svg{width:42%;height:42%;stroke:currentColor;fill:none;stroke-width:1.5}
.photos .p .cov{position:absolute;left:6px;top:6px;font-size:11px}
.ai{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-m);background:var(--info-soft);font-size:14px;align-items:flex-start}
.ai .ico{color:var(--info);margin-top:1px}
.ai b{display:block;margin-bottom:2px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px 16px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .oi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.opt.on .oi{background:var(--surface);color:var(--accent)}
.opt .grow{flex:1;min-width:0}
.opt b{display:block}
.opt .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.on .rad{border-color:var(--accent)}
.opt.on .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.dep-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.success{text-align:center;display:grid;gap:14px;justify-items:center;padding:20px 0}
.success .big{width:76px;height:76px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.success .big .ico{width:38px;height:38px;stroke-width:2.2}
.success h1{font-size:28px}

/* Messages */
.msg{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 150px);min-height:520px;overflow:hidden}
.clist{border-right:1px solid var(--line);overflow-y:auto}
.clist h2{font-size:20px;padding:18px 18px 10px}
.ci-row{display:flex;gap:12px;padding:12px 18px;cursor:pointer;border-left:3px solid transparent}
.ci-row:hover{background:var(--surface-2)}
.ci-row.on{background:var(--surface-2);border-left-color:var(--accent)}
.ci-row .th{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;color:var(--tile-ink);flex:none}
.ci-row .th svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5}
.ci-row .grow{min-width:0;flex:1}
.ci-row .l1{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.ci-row .l2,.ci-row .l3{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-row.unread .l3{color:var(--fg);font-weight:600}
.thread{display:flex;flex-direction:column;min-width:0}
.th-h{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.th-h .grow{flex:1;min-width:0}
.th-h .back{display:none;border:0;background:transparent;padding:4px}
.th-listing{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface-2);font-size:14px}
.th-listing .grow{flex:1;min-width:0}
.bubbles{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:72%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45}
.bub.them{background:var(--surface-2);border-bottom-left-radius:6px;align-self:flex-start}
.bub.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px;align-self:flex-end}
.bub time{display:block;font-size:11px;opacity:.65;margin-top:3px}
.day{align-self:center;font-size:12px;color:var(--muted)}
.offer-card{align-self:flex-start;max-width:320px;width:100%;border:1.5px solid var(--sun);border-radius:var(--r-m);padding:14px;display:grid;gap:10px;background:var(--surface)}
.offer-card .amt{font-family:var(--f-display);font-size:26px;font-weight:800}
.offer-card .acts{display:flex;gap:8px;flex-wrap:wrap}
.compose{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--surface-2);outline:0}
.compose input:focus{border-color:var(--accent)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--fg)}
.icon-btn.p{background:var(--accent);color:var(--accent-ink)}
.safety{font-size:12px;color:var(--muted);text-align:center;padding:0 18px 8px}
@media (max-width:760px){
  .msg{grid-template-columns:1fr;height:calc(100vh - 140px);border-radius:0;border-left:0;border-right:0}
  .msg.open .clist{display:none}
  .msg:not(.open) .thread{display:none}
  .th-h .back{display:block}
  .bub{max-width:85%}
  .screen.msgs{padding-block:0}
  .screen.msgs .wrap{padding:0}
}

/* Checkout */
.co{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.co .card{padding:22px;display:grid;gap:16px}
.co h2{font-size:18px}
.sum{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
.sum-item{display:flex;gap:12px;align-items:center}
.sum-item .ph{width:64px;height:52px;border-radius:10px;display:grid;place-items:center;color:var(--tile-ink);flex:none}
.sum-item .ph svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.lines{display:grid;gap:8px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines .tot{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:18px;font-weight:700}
.relays{display:grid;gap:8px}
.relay{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 12px;border-radius:var(--r-s);border:1px solid var(--line);cursor:pointer}
.relay.on{border-color:var(--accent);background:var(--accent-soft)}
.cardrow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.timeline{display:grid;gap:0;text-align:left;width:100%;max-width:440px;margin-top:8px}
.tl{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tl.done .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl.now .b{border-color:var(--accent)}
.tl.now .b::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .b .ico{width:14px;height:14px;stroke-width:3}
.tl b{display:block;font-size:15px}
@media (max-width:900px){.co{grid-template-columns:1fr}.sum{position:static}.cardrow{grid-template-columns:1fr 1fr}.cardrow .inp:first-child,.cardrow .field:first-child{grid-column:1/-1}}

/* Account */
.prof{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.prof .av{width:68px;height:68px;font-size:24px;background:var(--accent-soft);color:var(--accent)}
.prof h1{font-size:26px}
.prof .grow{flex:1;min-width:200px}
.prof .facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.mylist{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.my{display:flex;align-items:center;gap:14px;padding:12px 14px}
.my .ph{width:72px;height:56px;border-radius:10px;display:grid;place-items:center;color:var(--tile-ink);flex:none}
.my .ph svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5}
.my .grow{flex:1;min-width:0}
.my .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my .st{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.my .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.my{flex-wrap:wrap}.my .grow{flex:1 1 calc(100% - 90px)}.my .acts{width:100%;justify-content:flex-start}}
.wal{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.wal .card{padding:22px;display:grid;gap:12px;align-content:start}
.wal .bal{font-family:var(--f-display);font-size:40px;font-weight:800}
.wal .tx{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.wal .tx:last-child{border-bottom:0}
.pos{color:var(--good);font-weight:700}
@media (max-width:760px){.wal{grid-template-columns:1fr}}

/* Pro */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:18px;display:grid;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800}
.kpi .d{font-size:13px;font-weight:600}
.up{color:var(--good)}
.down{color:var(--danger)}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.pro-g{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.pro-g .card{padding:20px;display:grid;gap:14px;align-content:start}
.pro-g h3{font-size:17px}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}
.chart .bar.wk{fill:var(--accent-soft)}
.chart text{fill:var(--muted);font:500 11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.quota{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.quota i{display:block;height:100%;background:var(--accent);border-radius:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
@media (max-width:900px){.pro-g{grid-template-columns:1fr}}

/* Screen index */
.idx-btn{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.idx{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:70;width:260px;padding:10px;display:grid;gap:2px;box-shadow:var(--shadow)}
.idx a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:14px}
.idx a:hover,.idx a.on{background:var(--surface-2)}
.idx a span{color:var(--muted);font-size:12px;margin-left:auto}
@media (max-width:760px){.idx-btn{bottom:calc(140px + env(safe-area-inset-bottom,0px));padding:9px 12px}.idx{bottom:calc(186px + env(safe-area-inset-bottom,0px))}}
footer{border-top:1px solid var(--line);margin-top:20px}
footer .wrap{padding-block:26px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
@media (max-width:760px){footer{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  <div class="prof"><span class="av" style="border-radius:16px;background:var(--fg);color:var(--bg)">AU</span><div class="grow"><span class="eyebrow">Espace Pro</span><h1>Auto Rhône Services</h1><div class="facts"><span class="pill info">Pro Essentiel</span><span class="pill">SIRET 812 345 678 00021</span><span class="pill">3 utilisateurs</span></div></div><a class="btn btn-s" href="#recherche">${ico('store')}Voir ma boutique</a><a class="btn btn-p" href="#deposer">${ico('plus')}Nouvelle annonce</a></div>
  <div class="kpis">
    ${[['Vues (30 j)','12 480','+18 %',1],['Contacts','312','+9 %',1],['Ventes','27','+4',1],['Taux de réponse','92 %','−3 pts',0]].map(k=>`<div class="kpi card"><span class="small muted">${k[0]}</span><span class="v num">${k[1]}</span><span class="d ${k[3]?'up':'down'}">${k[2]} vs mois précédent</span></div>`).join('')}
  </div>
  <div class="pro-g">
    <div class="card chart"><div class="sec-h" style="margin:0"><h3>Vues des annonces, 14 derniers jours</h3><span class="small muted">week-ends en couleur pleine</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vues par jour, de 298 à 610">
        ${[0,200,400,600].map(g=>{const y=H-20-g/max*(H-24);return `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/><text x="0" y="${y-4}">${g}</text>`}).join('')}
        ${bars}
        ${['4 nov.','11 nov.','17 nov.'].map((t,i)=>`<text x="${[6,7*bw+6,W-40][i]}" y="${H-4}">${t}</text>`).join('')}
      </svg></div>
    <div class="card"><h3>Abonnement</h3><div><b>Pro Essentiel</b> · <span class="num">49 € HT / mois</span><div class="small muted">Renouvellement le 1er décembre</div></div>
      <div><div class="small" style="display:flex;justify-content:space-between"><span>Annonces actives</span><b class="num">120 / 200</b></div><div class="quota" style="margin-top:6px"><i style="width:60%"></i></div></div>
      <div class="small" style="display:grid;gap:6px"><span>${ico('check','ico" style="width:15px;height:15px;vertical-align:-3px;color:var(--accent)')} Boutique personnalisée</span><span>${ico('check','ico" style="width:15px;height:15px;vertical-align:-3px;color:var(--accent)')} Import par flux XML / API</span><span>${ico('check','ico" style="width:15px;height:15px;vertical-align:-3px;color:var(--accent)')} 5 remontées offertes par mois</span></div>
      <button class="btn btn-s btn-sm" data-toast="Comparaison des formules Pro">Changer de formule</button></div>
    <div class="card"><h3>Import automatique</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill ok"><span class="dot"></span>Flux actif</span><span class="small muted">Dernière synchro aujourd'hui à 06:00</span></div>
      <div class="lines num"><div><span>Annonces créées</span><b>8</b></div><div><span>Mises à jour</span><b>41</b></div><div><span>Rejetées</span><b class="down">2</b></div></div>
      <button class="btn btn-s btn-sm" data-toast="Rapport : 2 annonces sans photo">Voir le rapport</button></div>
    <div class="card"><h3>Équipe</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Membre</th><th>Rôle</th></tr></thead><tbody>
      <tr><td>Karim A.</td><td><span class="pill info">Administrateur</span></td></tr><tr><td>Sophie L.</td><td><span class="pill">Gestion des annonces</span></td></tr><tr><td>Hugo T.</td><td><span class="pill">Messagerie</span></td></tr>
    </tbody></table></div><button class="btn btn-s btn-sm" data-toast="Invitation envoyée">${ico('plus')}Inviter un membre</button></div>
    <div class="card" style="grid-column:1/-1"><h3>Factures</h3><div class="tbl-wrap"><table class="tbl num"><thead><tr><th>Numéro</th><th>Date</th><th>Objet</th><th>HT</th><th>TVA</th><th></th></tr></thead><tbody>
      ${[['F-2026-1104','1 nov. 2026','Abonnement Pro Essentiel','49,00 €','9,80 €'],['F-2026-1032','18 oct. 2026','Pack 10 remontées','24,00 €','4,80 €'],['F-2026-1001','1 oct. 2026','Abonnement Pro Essentiel','49,00 €','9,80 €']].map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td><td>${f[4]}</td><td><button class="btn btn-g btn-sm" data-toast="Facture PDF (maquette)">PDF</button></td></tr>`).join('')}
    </tbody></table></div></div>
  </div></div>`;
};

/* ---------- Routeur ---------- */
const SCREENS=[['accueil','Accueil et recherche'],['recherche','Résultats et carte'],['annonce','Fiche annonce'],['deposer','Déposer une annonce'],['messages','Messagerie et offres'],['paiement','Paiement sécurisé'],['compte','Espace utilisateur'],['pro','Espace Pro']];
function render(){
  let r=(location.hash||'#accueil').slice(1);if(!R[r])r='accueil';
  $('#app').innerHTML=R[r]();
  $('#hdr').classList.toggle('has-search',r==='recherche');
  document.querySelectorAll('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  $('#idx').innerHTML='<div class="eyebrow" style="padding:6px 10px">Écrans de la maquette</div>'+SCREENS.map((s,i)=>`<a href="#${s[0]}" class="${s[0]===r?'on':''}">${s[1]}<span>${i+1}/8</span></a>`).join('');
  const bb=$('#bubbles');if(bb)bb.scrollTop=bb.scrollHeight;
  bind();
}
let lastR='';
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r==='deposer'&&lastR!=='deposer'){}if(r==='paiement')S.paid=false;render();if(r!==lastR)window.scrollTo(0,0);lastR=r;$('#idx').hidden=true});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}

function bind(){
  const f=$('#bigsearch');if(f)f.onsubmit=e=>{e.preventDefault();S.cat=null;location.hash='recherche'};
  const fc=$('#fcat');if(fc)fc.onchange=()=>{S.cat=fc.value||null;render()};
  const fk=$('#fkm');if(fk){fk.oninput=()=>{$('#kmv').textContent=fk.value+' km'};fk.onchange=()=>{S.maxKm=+fk.value;render()}}
  const fs=$('#fship');if(fs)fs.onchange=()=>{S.ship=fs.checked;render()};
  const pm=$('#pmax');if(pm)pm.onchange=()=>{S.priceMax=pm.value.replace(/\D/g,'');render()};
  const cp=$('#compose');if(cp)cp.onsubmit=e=>{e.preventDefault();const v=$('#msgin').value.trim();if(!v)return;CONVS[S.conv].msgs.push({me:true,t:v.replace(/</g,'&lt;'),h:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});render();$('#msgin').focus()};
}
$('#hsearch').onsubmit=e=>{e.preventDefault();S.cat=null;location.hash='recherche';render()};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-fav],[data-go],[data-toast],[data-cat],[data-setcat],[data-ship],[data-view],[data-pin],[data-thumb],[data-dep],[data-newdep],[data-optg],[data-conv],[data-back],[data-simaccept],[data-deliv],[data-relay],[data-pay],[data-tab],[data-tabgo],[data-offer],[data-reset],[data-go-pay]');
  if(!t)return;const d=t.dataset;
  if(d.fav){e.preventDefault();e.stopPropagation();const id=+d.fav;S.favs.has(id)?(S.favs.delete(id),toast('Retiré des favoris')):(S.favs.add(id),toast('Ajouté à vos favoris'));render();return}
  if(d.toast){e.preventDefault();toast(d.toast);return}
  if(d.go){S.cur=+d.go;S.thumb=0;S.offer=null;location.hash='annonce';return}
  if(d.cat){S.cat=d.cat}
  if(d.setcat){S.cat=S.cat===d.setcat?null:d.setcat;render();return}
  if(d.ship){S.ship=!S.ship;render();return}
  if(d.reset){S.cat=null;S.ship=false;S.maxKm=10;S.priceMax='';render();return}
  if(d.view){S.view=d.view;render();return}
  if(d.pin){S.cur=+d.pin;render();return}
  if(d.thumb){S.thumb=+d.thumb;render();return}
  if(d.dep){const n=S.depStep+(+d.dep);if(n>3){S.depDone=true}else S.depStep=Math.max(0,n);render();window.scrollTo(0,0);return}
  if(d.newdep){S.depDone=false;S.depStep=0;render();return}
  if(d.optg){t.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===t));return}
  if(d.conv){S.conv=+d.conv;S.open=true;CONVS[S.conv].unread=false;render();return}
  if(d.back){S.open=false;render();return}
  if(d.goPay){S.cur=+d.goPay}
  if(d.simaccept){const m=CONVS[S.conv].msgs.find(x=>x.offer);m.status='acceptee';S.cur=CONVS[S.conv].l;S.offer=m.offer;CONVS[S.conv].msgs.push({t:"C'est d'accord pour 160 €, vous pouvez payer depuis l'offre.",h:'10:05'});render();toast('Offre acceptée par le vendeur');return}
  if(d.deliv){S.deliv=d.deliv;render();return}
  if(d.relay){S.relay=+d.relay;render();return}
  if(d.pay){S.paid=true;render();window.scrollTo(0,0);return}
  if(d.tabgo){S.tab=d.tabgo}
  if(d.tab&&!t.closest('.hnav')){S.tab=d.tab;render();return}
  if(d.tab){S.tab=d.tab}
  if(d.offer){openOffer();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest&&e.target.closest('[data-go],[data-conv]');if(c)c.click()}if(e.key==='Escape'){const o=$('.ov');if(o)o.remove();$('#idx').hidden=true}});

function openOffer(){
  const l=byId(S.cur);const sug=[.9,.85,.8].map(r=>Math.round(l.p*r/5)*5);
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="oft"><h3 id="oft">Faire une offre</h3><p class="small muted">Prix affiché : ${price(l)}. Le vendeur a 48 h pour accepter, refuser ou faire une contre-offre.</p>
  <div class="offer-sugg">${sug.map((s,i)=>`<button data-s="${s}" class="${i===0?'on':''}">${eur(s)}</button>`).join('')}</div>
  <div class="money-inp"><input id="offin" inputmode="numeric" value="${sug[0]}" aria-label="Montant de l'offre"><b style="font-size:22px">€</b></div>
  <div style="display:flex;gap:10px"><button class="btn btn-s" style="flex:1" id="ofx">Annuler</button><button class="btn btn-p" style="flex:1" id="ofok">Envoyer l'offre</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov||e.target.id==='ofx')ov.remove();const b=e.target.closest('[data-s]');if(b){ov.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));ov.querySelector('#offin').value=b.dataset.s}
    if(e.target.closest('#ofok')){const v=+ov.querySelector('#offin').value||sug[0];ov.remove();toast(`Offre de ${eur(v)} envoyée au vendeur`)}};
  ov.querySelector('#offin').focus();
}
const ib=$('#idxBtn');ib.onclick=()=>{const x=$('#idx');x.hidden=!x.hidden;ib.setAttribute('aria-expanded',String(!x.hidden))};
render();lastR=(location.hash||'#accueil').slice(1);
</script>

</body></html>
